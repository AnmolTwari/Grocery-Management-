# Tests must be reproducible without the shared development database or its
# credentials. The normal dev and prod profiles continue to use PostgreSQL.
spring.datasource.url=jdbc:h2:mem:grocery;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
