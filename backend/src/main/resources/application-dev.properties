# Development configuration - PostgreSQL hosted on Supabase
#
# Supabase is used ONLY as the Postgres host - no Supabase APIs.
# All data work stays in Spring Boot / JPA.
#
# host: db.skzvyqtdufbemaqywxjo.supabase.co  port: 5432  db: postgres
#
# The password has NO default - provide it via the DB_PASSWORD
# environment variable (never commit it). Example:
#   DB_PASSWORD="..." ./mvnw spring-boot:run
#
# To use a different Postgres (e.g. a local one), override via the same
# environment variables.
spring.datasource.url=${DB_URL:jdbc:postgresql://db.skzvyqtdufbemaqywxjo.supabase.co:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Auto-create / update tables while developing.
# Replaced by schema validation once migrations are introduced.
spring.jpa.hibernate.ddl-auto=update

# Show pretty SQL in dev logs.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true