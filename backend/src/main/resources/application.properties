spring.application.name=grocery-backend
spring.config.import=optional:file:.env[.properties]

# Use PostgreSQL (Supabase) for real data, credentials from .env
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# H2 console not used with PostgreSQL

# JWT Configuration
# Secret must be at least 32 chars for HS256. Override in production via JWT_SECRET.
jwt.secret=${JWT_SECRET:groceryShopManagementSystemSecretKey2024MustBeAtLeast32CharsForHS256Algorithm}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Server port
server.port=8081