# Production configuration
#
# All secrets MUST come from the environment. Nothing sensitive is
# hardcoded here, and startup fails fast if any required variable is unset.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Schema is managed outside the app in production; only validate on startup.
spring.jpa.hibernate.ddl-auto=validate

# Keep SQL out of production logs.
spring.jpa.show-sql=false